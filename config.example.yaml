# ============================================================================
#  CONFIGURATION — edit this file, it is git-ignored so it is safe to keep
#  your key in it. Copy config.example.yaml -> config.yaml to start.
#
#  This project uses NO YouTube API, so there is no OAuth, no quota and no
#  audit. The only secret here is the optional free Gemini key.
# ============================================================================

channel:
  # The topic of your channel. This drives every generated script and image.
  # Be specific — "history" is weak, "forgotten medieval engineering" is strong.
  # Each run picks ONE different story inside this topic. Override one run with:
  #   python main.py generate --topic "your one-off idea"
  topic: "unusual true stories from maritime history"

  # Tone of the narration. Tuned for fast, high-retention Shorts by default.
  # Examples: fast and punchy, dark and dramatic, warm and conversational,
  # dry and witty, calm and factual.
  tone: "fast, punchy, high-energy"

  # Who is watching. Affects the voice and the writing.
  audience: "scrolling TikTok/Shorts viewers with short attention spans"

  # Target length of the finished video, in seconds. 65 is the default —
  # a portrait Short. Use 90-180 for landscape videos.
  # Override one run with:  python main.py generate --seconds 120
  target_seconds: 65

  # Language / accent for the voiceover (BCP-47 style edge-tts voice).
  # Free options include:
  #   en-US-AriaNeural      en-US-GuyNeural       en-US-JennyNeural
  #   en-GB-RyanNeural      en-GB-SoniaNeural     en-AU-NatashaNeural
  #   it-IT-ElsaNeural      it-IT-DiegoNeural     de-DE-KatjaNeural
  # Full list: python main.py voices --lang en-
  voice: "en-GB-RyanNeural"

  # Narration speed. "+40%" is brisk TikTok pacing, ~180 wpm (recommended),
  # "+0%" is normal speed, "-10%" is slow and dramatic. Range -50%..+100%.
  # Script word budgets scale automatically, so the video still hits
  # target_seconds — faster speech just fits more words.
  speech_rate: "+40%"

  # ElevenLabs premium voice (https://elevenlabs.io/app/settings/api-keys):
  # used instead of edge-tts when keys + voice_id are set. Any failure falls
  # back to edge-tts automatically. Free tier is ~10k chars/month (~11
  # Shorts). Env ELEVENLABS_KEYS (space/comma-separated) wins.
  elevenlabs_api_keys:
    - ""
  # Voice ID from the ElevenLabs voice library (e.g. Sarah:
  # EXAVITQu4vr4xnSDxMaL). Empty = ElevenLabs stays off.
  elevenlabs_voice_id: ""
  elevenlabs_model: "eleven_turbo_v2_5"
  # Delivery tuning (voice_settings): steadier narration that does not
  # machine-gun short sentences. 0..1 each; delete lines to reset.
  elevenlabs_stability: 0.65
  elevenlabs_similarity: 0.6
  elevenlabs_style: 0.25

  # Spoken language, used to prompt the script writer.
  language: "English"

  # YouTube category id, prefilled into each video's CHECKLIST.md.
  # 22=People & Blogs, 27=Education, 24=Entertainment, 28=Science & Technology,
  # 15=Pets & Animals, 17=Sports, 10=Music, 20=Gaming, 26=Howto & Style
  category_id: "22"

  # Extra tags appended to every video.
  default_tags: []

video:
  # portrait  = 1080x1920 vertical. Under 3 minutes, YouTube shelves it as a Short.
  # landscape = 1920x1080 regular video.
  # Override one run with:  python main.py generate --format landscape --seconds 120
  format: "portrait"

  fps: 30
  # Snappy Ken Burns zoom. 1.0 = static image, 1.18 = punchy push in/out.
  # Shots alternate direction so the motion never feels repetitive.
  zoom: 1.18
  # Reserved for future scene transitions. Scenes currently cut hard with a
  # whoosh SFX — this value is read but has no visual effect yet.
  transition: 0.5

  # Pictures per narrated scene, 1-6. 3 is the default: each scene cuts
  # through three different framings (wide, detail, new angle...).
  # Slower runs, denser videos — each picture is one more free generation.
  # Override one run with:  python main.py generate --images-per-scene 2
  images_per_scene: 3

  # Art direction — one flag flips the whole genre:
  #   photoreal = cinematic documentary look (default)
  #   cartoon   = flat 2D vector toon, bold outlines, vivid colors
  #   stickman  = whiteboard stick-figure explainer (the viral TikTok look:
  #               black stick figures + hand-drawn props on paper texture)
  # Override one run with:  python main.py generate --style stickman
  style: "photoreal"

  # Video encoder. "auto" = fastest hardware encoder this FFmpeg offers (NVENC >
  # QuickSync > VideoToolbox), same output much faster on a GPU machine;
  # or force one: "nvenc", "qsv", "videotoolbox".
  encoder: "auto"  # "cpu" = libx264 veryfast (always works, slower)

subtitles:
  # TikTok-style karaoke captions: big centered text with a word-by-word
  # gold highlight, burned into the video. A captions.srt is ALSO
  # written for manual upload in YouTube Studio either way (accessibility + SEO).
  # Skip for one run with:  python main.py generate --no-subs
  enabled: true
  # Placement: "default" = center on portrait karaoke (the TikTok look),
  # bottom otherwise (the clip lane defaults to bottom: shorts-safe).
  # Force top/middle/bottom when captions cover the main event; the clip
  # lane also takes --sub-pos auto per run (frame analysis picks the
  # calmest third — free, no API).
  position: "default"
  font: "Arial"      # any installed font name (Impact, Verdana, ...)
  font_scale: 1.0    # 1.0 = current sizes; 1.2 = 20% bigger text
  outline: 0         # 0 = engine default (scales with font_scale); 1-6 = fixed stroke
  caps: false        # true = ALL-CAPS captions (SRT + karaoke + clips)
  # Mask swear words in captions (fuck -> f*ck), whole words only.
  mask_profanity: true

parts:
  # Series splitter: mechanical ~60s episodes ("Title — Part X").
  part_len: 60
  max_parts: 50
  # Opening top header ("<title> / Part X", fades after 4 s). Whole /
  # single-part videos show just the title. --no-header disables it.
  header: true
  header_seconds: 4.0
  # Header title wraps to this many lines before the lane asks the LLM
  # to shorten it (existing keys, never fatal). false = always truncate.
  header_max_lines: 3
  shorten_titles: true
  # A trailing tail shorter than this joins the previous part.
  tail_merge: 15.0
  # Sentence-snap search radius around each ideal cut.
  snap_window: 10.0

disclosure:
  # YouTube requires AI-made videos to be disclosed. This footer is appended
  # to description.txt at package time. You ALSO tick the "altered content"
  # box in YouTube Studio — the per-video CHECKLIST.md reminds you.
  append_to_description: true
  text: "Disclosure: the narration and visuals in this video were generated with AI tools."

music:
  # Background music bed, automatically ducked under the narration.
  # Source, in order: music.file below > first audio file in music/ >
  # built-in royalty-free loop (synthesized, monetization-safe).
  # See music/README.txt for where to get free tracks.
  enabled: true
  file: ""
  folder: "music"
  # Bed loudness in dB. -24 is subtle, -18 is clearly present.
  level_db: -24
  # Dip the music while the narrator speaks. If your FFmpeg lacks the
  # sidechain filter you silently get a static bed instead.
  duck: true

sfx:
  # Airy whoosh on every scene cut, soft pop when the end-card CTA lands.
  whoosh: true
  whoosh_db: -12
  cta_pop: true

progress_bar:
  # Gold bar along the edge that fills as the video plays. Cheap to render,
  # and retention loves a visible finish line.
  enabled: true
  color: "0xFFD700"
  height: 12
  position: "bottom"  # top | bottom

cta:
  # Call to action, spoken by the narrator AND shown as an end card.
  # Just a gentle "follow for more" by default — comment-bait only works
  # once you have an audience that answers, so add bait lines here later
  # (each video takes the next line; counter in cta_state.json).
  enabled: true
  lines:
    - "Follow for more."
  overlay_lines:
    - "FOLLOW FOR MORE!"
  overlay_seconds: 3.5

topics:
  # Self-refilling idea queue. The scheduler pops one topic per video;
  # `python main.py topics --topup` asks Gemini to refill the file to
  # backlog_target (skips anything already there).
  backlog_file: "topics/backlog.txt"
  backlog_target: 24

factcheck:
  # Second Gemini pass over every script before the voiceover: fixes wrong
  # dates/names/numbers, cuts unfixable claims. Needs the free Gemini key;
  # without one it skips silently. Never blocks a render on failure.
  enabled: true

youtube:
  # YouTube Data API v3 keys: one Cloud project per key, each with its own
  # free 10k-units/day pool. Powers `python main.py yt`: video/channel
  # stats cost 1 unit, Shorts niche search costs 100. Quota is tracked and
  # printed every run. Env YOUTUBE_KEYS (space/comma-separated) wins.
  # Enable at https://console.cloud.google.com/apis/library/youtube.googleapis.com
  api_keys:
    - ""

whole:
  # Short source? No cutting: `clip` and `parts` both turn any video up to
  # this long into ONE vertical short — subtitles + the title on top
  # (fades after parts.header_seconds), no "Part 1". 0 = always cut.
  # 180 = YouTube's 3:00 Shorts cap, so every auto-whole short is a Short.
  # Per run: --whole forces one piece (warns past 3:00), --no-whole forces
  # cutting, --half splits into two halves at the sentence end nearest
  # the middle.
  under_seconds: 180

longform:
  # Long-form lane (`python main.py longform <link>`): the clip lane's
  # landscape sibling — the source as ONE 1920x1080 video (or ONE ~N-minute
  # episode with --minutes N, opened at --start), karaoke subs at the
  # bottom, YouTube chapter timestamps + attribution in the kit. Transcript
  # cache is shared with clip/parts: cross-lane re-runs are free. Output
  # lands in longform/ (never the Telegram phone queue — long files are
  # over its 50 MB cap).
  # Whole sources longer than this many minutes print a heads-up but still
  # render whole (1-120; --minutes N cuts an episode instead).
  max_minutes: 20
  # Chapter marks in DESCRIPTION.txt — 0:00 first, snapped to real
  # sentence ends/pauses, labelled with the words actually spoken there.
  # YouTube only engages chapters at 3+ marks; fewer is written as none.
  # --no-chapters skips for one run.
  chapters: true
  # Ideal seconds between marks (30-600).
  chapter_seconds: 120
  # Two marks never closer than this (15-300).
  chapter_min_gap: 60
  # --top N compilation mode: the picker builds a countdown of the
  # source's best chapters (numbered cards, best moment last). Tuned by
  # moments / min_len / max_len / target_seconds below; ~1 LLM call per
  # picker window on a cached transcript.
  moments: 6
  min_len: 40
  max_len: 90
  target_seconds: 360

meeting:
  # The boardroom (`python main.py meeting stats|pick`): four AI seats —
  # Strategist (Gemini), Analyst (DeepSeek), Producer (Groq), Skeptic
  # (OpenRouter) — plus a chair that writes minutes and machine-checked
  # decisions. Seats without keys ride the fallback chain: you lose
  # personality, never the meeting. Minutes land in out/meetings/, a
  # short summary in your Telegram DM. `meeting pick --render` clips the
  # winner and pops it from the watchlist.
  rounds: 2               # speaking rounds (each seat talks once per round)
  max_words: 70           # per turn — the room stays sharp
  watchlist: "topics/sources.txt"  # pick candidates, "URL | note" per line

snap:
  # `python main.py snap` — stats for every channel you track (add each
  # once: snap --add @handle). Uses the youtube keys above, ~3 units per
  # channel per run of your 10,000/day. Public data only: views, likes,
  # comments, subs (YouTube rounds public sub counts to 3 digits).
  recent: 10        # videos shown per channel (--recent N overrides)
  fetch_limit: 50   # newest uploads fetched + remembered per channel
  keep_days: 180    # days of history kept for the day-over-day deltas

crew:
  # Autonomous missions: python main.py crew --days 3 --per-day 4
  # (Telegram /crew, /stop). Drafts unless --live.
  cycle_minutes: 10  # loop cadence; the stop file is checked more often
  digest_hour: 21  # local hour for the nightly Herald digest
  premium_voices: 1  # ElevenLabs videos/day, rest use edge-tts
  max_searches: 3  # YouTube niche searches/day (100 units each)

jarvis:
  # Channel manager: python main.py jarvis "..." + Telegram /jarvis.
  # Drafts by default — flip auto_schedule once you trust it.
  auto_schedule: false
  # Hard cap per task (render_videos refuses more, with a note).
  max_videos: 5

schedule:
  # Unattended daily rendering: `python main.py schedule` pops backlog
  # topics and renders forever (Ctrl+C stops). Telegram-notifies each
  # finished video when the bot is configured.
  per_day: 2
  # Fixed clock times ("08:00,20:00"); empty = evenly spaced from launch.
  at: ""

ai:
  # Which script writer to use.
  #   "gemini"   -> best quality. Needs a FREE key from https://aistudio.google.com/apikey
  #   "template" -> no key, no network. Lower quality but always works.
  provider: "gemini"

  # Legacy single Gemini key (kept working); prefer the list below.
  gemini_api_key: ""
  # Free Gemini keys (https://aistudio.google.com/apikey) — one per Google
  # account. Rejected/rate-limited keys rotate automatically, so five keys
  # is roughly 5x the free quota. Env GEMINI_API_KEYS (space/comma-separated)
  # wins, else GEMINI_API_KEY (single).
  gemini_api_keys:
    - ""
  # Script-writing model. The default tracks the current Flash automatically;
  # if it ever 404s (Google renames models regularly) or saturates (503),
  # the built-in fallback chain tries pinned IDs in order, starting with
  # "gemini-flash-lite-latest" (verified answering, Sep 2026).
  # You can also set that ID explicitly here to skip straight to it.
  gemini_model: "gemini-3.8-flash"

  # Free Groq keys (https://console.groq.com/keys) — script/topic/factcheck
  # fallback after Gemini, with key rotation spreading the free-tier quota.
  # Several keys = several quotas. Env GROQ_API_KEYS (comma-separated) wins.
  groq_api_keys:
    - ""
  groq_model: "openai/gpt-oss-120b"

  # Editorial passes after factcheck: punch-up (retention) then decringe
  # (taste veto). Skipped automatically without an LLM key.
  editorial_passes: true

  # OpenRouter free-model overflow lane (https://openrouter.ai/keys) —
  # last LLM resort before the offline template.
  openrouter_api_keys:
    - ""
  openrouter_model: "nvidia/nemotron-3-ultra-550b-a55b:free"

  # DeepSeek (https://platform.deepseek.com) — free-tier LLM lane after
  # OpenRouter: rate-limited but persistent, no card. Verified live
  # 2026-09-21: deepseek-flash (fast) and deepseek-v4-pro (smart) both
  # answer free. Same list form as the other providers; env DEEPSEEK_KEYS
  # (comma-separated) wins.
  deepseek_api_keys:
    - ""
  deepseek_model: "deepseek-flash"

  # Azure OpenAI ($100 student credit): best-quality lane, spend-guarded.
  # Needs a deployment in the Azure portal; the agent only ever holds the
  # endpoint key below (tokens only — it cannot spin up VMs or services).
  # Caps are enforced BEFORE every call; overruns fall back to free lanes.
  # See `python main.py costs` for the live ledger.
  azure_endpoint: ""
  azure_api_key: ""
  azure_deployment: ""
  azure_model: ""            # base model id for pricing, e.g. gpt-4o-mini
  azure_max_usd_per_day: 1.0
  azure_max_usd_per_month: 5.0

  # Images walk a provider chain until one delivers: the primary first,
  # then each fallback in order. Providers missing their key are skipped
  # automatically, never fatal. Image dimensions follow video.format
  # automatically (landscape 1280x720, portrait 720x1280).
  image_provider: "pexels"   # or "pixabay" or "pollinations" or "gemini"
  image_fallbacks: ["pixabay", "pollinations", "gemini"]
  # Free key from https://www.pexels.com/api (no card) — real stock
  # photos as the primary image lane; lane skipped when empty.
  pexels_api_key: ""
  # Pixabay (https://pixabay.com/api/docs/) — second stock-photo lane,
  # tried when Pexels misses or runs dry (it sits in image_fallbacks by
  # default). ~100 requests/minute per key, no published monthly cap.
  # Single key or list: pixabay_api_keys: [k1, k2].
  pixabay_api_key: ""
  pixabay_api_keys:
    - ""
  # Seconds to wait per image before giving up.
  image_timeout: 90
  # Pollinations model. "flux" is free and unlimited (recommended).
  # "turbo" is faster but metered — anonymous turbo is throttled hard,
  # so only set it together with a pollinations_token below.
  image_model: "flux"
  # Optional free token from https://auth.pollinations.ai — raises the
  # anonymous ~1 req/15s limit to ~1 req/5s and removes the watermark.
  # Or export POLLINATIONS_TOKEN.
  pollinations_token: ""
  # The "gemini" fallback reuses gemini_api_key above — no extra signup.
  # Parallel image downloads. The built-in pacer spaces request starts
  # (~1/15s anonymous Pollinations, ~1/5s with token), so extra workers
  # only overlap download time. Keep at 1.
  image_workers: 1

paths:
  work_dir: "work"
  out_dir: "out"
  package_dir: "upload"
  state_file: "state.json"

telegram:
  # Phone control (free): text the bot a topic, get back a finished video.
  # Your PC must be on with `python main.py bot` running — the bot polls
  # Telegram from here, so no firewall or port setup is needed.
  enabled: false

  # 1. Message @BotFather on Telegram -> /newbot -> paste the token here
  #    (or export TELEGRAM_BOT_TOKEN instead of writing it in this file).
  bot_token: ""

  # 2. Message @userinfobot on Telegram -> paste your numeric user id here.
  #    The bot ONLY talks to this account — everyone else is ignored.
  owner_id: 0

buffer:
  # Autopost (free): `python main.py autopost` uploads the finished mp4 and
  # creates one Buffer post per channel below. Drafts by default; add
  # --publish / --schedule / --at to release. Proven with TikTok + YouTube.
  # Get a key free at https://publish.buffer.com/settings/api
  # (or export BUFFER_API_KEY instead of writing it in this file).
  api_key: ""
  # Which connected channels to post to (order = posting order).
  channels: ["youtube", "tiktok"]
  # YouTube upload defaults.
  youtube_privacy: "public"     # public | unlisted | private
  youtube_category_id: "27"     # 27 = Education, 28 = Science & Technology
  made_for_kids: false

  # Video hosting: Buffer only accepts videos by public URL, so autopost
  # uploads the mp4 first. Free Cloudinary account (no card required):
  # https://cloudinary.com/users/register_free
  # Pick ONE of the two upload styles (preset wins if both are set):
  #   A. UNSIGNED (simplest, no secret in your config):
  #      1. Dashboard top bar -> copy "Cloud name" below (or export
  #         CLOUDINARY_CLOUD_NAME).
  #      2. Settings (gear) -> Upload -> Upload presets -> Add upload
  #         preset: name it (e.g. shorts), Signing Mode UNSIGNED, Save.
  #         Paste the preset name below (or export CLOUDINARY_UPLOAD_PRESET).
  #   B. SIGNED (no preset to create): Dashboard top bar -> copy "Cloud
  #      name", "API key", and reveal + copy the API secret (or export
  #      CLOUDINARY_CLOUD_NAME / CLOUDINARY_API_KEY / CLOUDINARY_API_SECRET).
  #      Prefer env vars for the secret over writing it in this file.
  # Or skip hosting entirely by passing --video-url to autopost.
  cloud_name: ""
  upload_preset: ""
  cloudinary_api_key: ""
  cloudinary_api_secret: ""

  # Chain package + autopost (as Buffer drafts) after every generate.
  # The only manual step left is reviewing drafts in Buffer.
  autopost_after_generate: false

# Crash reporting (Sentry student offer — free). Create a Python project at
# https://sentry.io, paste its DSN here, restart the bot: every crash then
# shows up in your Sentry dashboard instead of dying silently. Empty = off.
sentry:
  dsn: ""
  environment: "production"

# Dead-man's switch (Honeybadger student offer — free). Create a check-in
# named e.g. crew-heartbeat (simple schedule, report every 2 hours, grace
# 30 minutes) and paste its ID or ping URL here. The crew loop then pings it
# every cycle; if the pipeline dies mid-mission, Honeybadger emails you.
# Pause the check in the dashboard between missions. Empty = off.
honeybadger:
  check: ""
