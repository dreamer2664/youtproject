# ============================================================================
#  CONFIGURATION — edit this file, it is git-ignored so it is safe to keep
#  your key in it. Copy config.example.yaml -> config.yaml to start.
#
#  This project uses NO YouTube API, so there is no OAuth, no quota and no
#  audit. The only secret here is the optional free Gemini key.
# ============================================================================

channel:
  # The topic of your channel. This drives every generated script and image.
  # Be specific — "history" is weak, "forgotten medieval engineering" is strong.
  # Each run picks ONE different story inside this topic. Override one run with:
  #   python main.py generate --topic "your one-off idea"
  topic: "unusual true stories from maritime history"

  # Tone of the narration. Examples: calm and factual, dark and dramatic,
  # warm and conversational, dry and witty.
  tone: "calm, factual, quietly dramatic"

  # Who is watching. Affects the voice and the writing.
  audience: "curious adults who like short documentary-style videos"

  # Target length of the finished video, in seconds. 65 is the default —
  # a portrait Short. Use 90-180 for landscape videos.
  # Override one run with:  python main.py generate --seconds 120
  target_seconds: 65

  # Language / accent for the voiceover (BCP-47 style edge-tts voice).
  # Free options include:
  #   en-US-AriaNeural      en-US-GuyNeural       en-US-JennyNeural
  #   en-GB-RyanNeural      en-GB-SoniaNeural     en-AU-NatashaNeural
  #   it-IT-ElsaNeural      it-IT-DiegoNeural     de-DE-KatjaNeural
  # Full list: python main.py voices --lang en-
  voice: "en-GB-RyanNeural"

  # Spoken language, used to prompt the script writer.
  language: "English"

  # YouTube category id, prefilled into each video's CHECKLIST.md.
  # 22=People & Blogs, 27=Education, 24=Entertainment, 28=Science & Technology,
  # 15=Pets & Animals, 17=Sports, 10=Music, 20=Gaming, 26=Howto & Style
  category_id: "22"

  # Extra tags appended to every video.
  default_tags: []

video:
  # portrait  = 1080x1920 vertical. Under 3 minutes, YouTube shelves it as a Short.
  # landscape = 1920x1080 regular video.
  # Override one run with:  python main.py generate --format landscape --seconds 120
  format: "portrait"

  fps: 30
  # Gentle Ken Burns zoom. 1.0 = static image, 1.12 = slow push in.
  zoom: 1.12
  # Crossfade between scenes, seconds.
  transition: 0.5

  # Pictures per narrated scene, 1-6. 3 is the default: each scene cuts
  # through three different framings (wide, detail, new angle...).
  # Slower runs, denser videos — each picture is one more free generation.
  # Override one run with:  python main.py generate --images-per-scene 2
  images_per_scene: 3

subtitles:
  # Word-timed subtitles, burned into the video. A captions.srt is ALSO
  # written for manual upload in YouTube Studio either way (accessibility + SEO).
  # Skip for one run with:  python main.py generate --no-subs
  enabled: true

disclosure:
  # YouTube requires AI-made videos to be disclosed. This footer is appended
  # to description.txt at package time. You ALSO tick the "altered content"
  # box in YouTube Studio — the per-video CHECKLIST.md reminds you.
  append_to_description: true
  text: "Disclosure: the narration and visuals in this video were generated with AI tools."

ai:
  # Which script writer to use.
  #   "gemini"   -> best quality. Needs a FREE key from https://aistudio.google.com/apikey
  #   "template" -> no key, no network. Lower quality but always works.
  provider: "gemini"

  # Paste your free Gemini key here, or set GEMINI_API_KEY in the environment.
  # Leave blank to use the environment variable.
  gemini_api_key: ""
  gemini_model: "gemini-flash-latest"

  # Images are generated by Pollinations, which is free and needs NO key.
  # Image dimensions follow video.format automatically (landscape 1280x720,
  # portrait 720x1280).
  image_provider: "pollinations"
  # Seconds to wait per image before giving up.
  image_timeout: 90

paths:
  work_dir: "work"
  out_dir: "out"
  package_dir: "upload"
  state_file: "state.json"
