# ============================================================================
#  CONFIGURATION — edit this file, it is git-ignored so it is safe to keep
#  your key in it. Copy config.example.yaml -> config.yaml to start.
#
#  This project uses NO YouTube API, so there is no OAuth, no quota and no
#  audit. The only secret here is the optional free Gemini key.
# ============================================================================

channel:
  # The topic of your channel. This drives every generated script and image.
  # Be specific — "history" is weak, "forgotten medieval engineering" is strong.
  # Each run picks ONE different story inside this topic. Override one run with:
  #   python main.py generate --topic "your one-off idea"
  topic: "unusual true stories from maritime history"

  # Tone of the narration. Tuned for fast, high-retention Shorts by default.
  # Examples: fast and punchy, dark and dramatic, warm and conversational,
  # dry and witty, calm and factual.
  tone: "fast, punchy, high-energy"

  # Who is watching. Affects the voice and the writing.
  audience: "scrolling TikTok/Shorts viewers with short attention spans"

  # Target length of the finished video, in seconds. 65 is the default —
  # a portrait Short. Use 90-180 for landscape videos.
  # Override one run with:  python main.py generate --seconds 120
  target_seconds: 65

  # Language / accent for the voiceover (BCP-47 style edge-tts voice).
  # Free options include:
  #   en-US-AriaNeural      en-US-GuyNeural       en-US-JennyNeural
  #   en-GB-RyanNeural      en-GB-SoniaNeural     en-AU-NatashaNeural
  #   it-IT-ElsaNeural      it-IT-DiegoNeural     de-DE-KatjaNeural
  # Full list: python main.py voices --lang en-
  voice: "en-GB-RyanNeural"

  # Narration speed. "+40%" is brisk TikTok pacing, ~180 wpm (recommended),
  # "+0%" is normal speed, "-10%" is slow and dramatic. Range -50%..+100%.
  # Script word budgets scale automatically, so the video still hits
  # target_seconds — faster speech just fits more words.
  speech_rate: "+40%"

  # Spoken language, used to prompt the script writer.
  language: "English"

  # YouTube category id, prefilled into each video's CHECKLIST.md.
  # 22=People & Blogs, 27=Education, 24=Entertainment, 28=Science & Technology,
  # 15=Pets & Animals, 17=Sports, 10=Music, 20=Gaming, 26=Howto & Style
  category_id: "22"

  # Extra tags appended to every video.
  default_tags: []

video:
  # portrait  = 1080x1920 vertical. Under 3 minutes, YouTube shelves it as a Short.
  # landscape = 1920x1080 regular video.
  # Override one run with:  python main.py generate --format landscape --seconds 120
  format: "portrait"

  fps: 30
  # Snappy Ken Burns zoom. 1.0 = static image, 1.18 = punchy push in/out.
  # Shots alternate direction so the motion never feels repetitive.
  zoom: 1.18
  # Reserved for future scene transitions. Scenes currently cut hard with a
  # whoosh SFX — this value is read but has no visual effect yet.
  transition: 0.5

  # Pictures per narrated scene, 1-6. 3 is the default: each scene cuts
  # through three different framings (wide, detail, new angle...).
  # Slower runs, denser videos — each picture is one more free generation.
  # Override one run with:  python main.py generate --images-per-scene 2
  images_per_scene: 3

  # Art direction — one flag flips the whole genre:
  #   photoreal = cinematic documentary look (default)
  #   cartoon   = flat 2D vector toon, bold outlines, vivid colors
  #   stickman  = whiteboard stick-figure explainer (the viral TikTok look:
  #               black stick figures + hand-drawn props on paper texture)
  # Override one run with:  python main.py generate --style stickman
  style: "photoreal"

subtitles:
  # TikTok-style karaoke captions: big centered text with a word-by-word
  # yellow highlight, burned into the video. A captions.srt is ALSO
  # written for manual upload in YouTube Studio either way (accessibility + SEO).
  # Skip for one run with:  python main.py generate --no-subs
  enabled: true

disclosure:
  # YouTube requires AI-made videos to be disclosed. This footer is appended
  # to description.txt at package time. You ALSO tick the "altered content"
  # box in YouTube Studio — the per-video CHECKLIST.md reminds you.
  append_to_description: true
  text: "Disclosure: the narration and visuals in this video were generated with AI tools."

music:
  # Background music bed, automatically ducked under the narration.
  # Source, in order: music.file below > first audio file in music/ >
  # built-in royalty-free loop (synthesized, monetization-safe).
  # See music/README.txt for where to get free tracks.
  enabled: true
  file: ""
  folder: "music"
  # Bed loudness in dB. -24 is subtle, -18 is clearly present.
  level_db: -24
  # Dip the music while the narrator speaks. If your FFmpeg lacks the
  # sidechain filter you silently get a static bed instead.
  duck: true

sfx:
  # Airy whoosh on every scene cut, soft pop when the end-card CTA lands.
  whoosh: true
  whoosh_db: -12
  cta_pop: true

progress_bar:
  # Gold bar along the edge that fills as the video plays. Cheap to render,
  # and retention loves a visible finish line.
  enabled: true
  color: "0xFFD700"
  height: 12
  position: "bottom"  # top | bottom

cta:
  # Call to action, spoken by the narrator AND shown as an end card.
  # Just a gentle "follow for more" by default — comment-bait only works
  # once you have an audience that answers, so add bait lines here later
  # (each video takes the next line; counter in cta_state.json).
  enabled: true
  lines:
    - "Follow for more."
  overlay_lines:
    - "FOLLOW FOR MORE!"
  overlay_seconds: 3.5

topics:
  # Self-refilling idea queue. The scheduler pops one topic per video;
  # `python main.py topics --topup` asks Gemini to refill the file to
  # backlog_target (skips anything already there).
  backlog_file: "topics/backlog.txt"
  backlog_target: 24

factcheck:
  # Second Gemini pass over every script before the voiceover: fixes wrong
  # dates/names/numbers, cuts unfixable claims. Needs the free Gemini key;
  # without one it skips silently. Never blocks a render on failure.
  enabled: true

schedule:
  # Unattended daily rendering: `python main.py schedule` pops backlog
  # topics and renders forever (Ctrl+C stops). Telegram-notifies each
  # finished video when the bot is configured.
  per_day: 2
  # Fixed clock times ("08:00,20:00"); empty = evenly spaced from launch.
  at: ""

ai:
  # Which script writer to use.
  #   "gemini"   -> best quality. Needs a FREE key from https://aistudio.google.com/apikey
  #   "template" -> no key, no network. Lower quality but always works.
  provider: "gemini"

  # Paste your free Gemini key here, or set GEMINI_API_KEY in the environment.
  # Leave blank to use the environment variable.
  gemini_api_key: ""
  # Script-writing model. The default tracks the current Flash automatically;
  # if it ever 404s (Google renames models regularly), the built-in fallback
  # chain tries pinned IDs in order. Known-good free-tier IDs you can set
  # explicitly: "gemini-2.5-flash", "gemini-3-flash", "gemini-2.5-flash-lite".
  gemini_model: "gemini-flash-latest"

  # Images are generated by Pollinations, which is free and needs NO key.
  # Image dimensions follow video.format automatically (landscape 1280x720,
  # portrait 720x1280).
  image_provider: "pollinations"
  # Seconds to wait per image before giving up.
  image_timeout: 90
  # Pollinations model. Both are free: "turbo" is ~5x faster than "flux"
  # and looks the same at Shorts resolution once the Ken Burns zoom is
  # applied. Set "flux" for maximum quality.
  image_model: "turbo"
  # Parallel image downloads. Keep at 1: anonymous Pollinations allows
  # ~1 request per 15s, so extra workers only earn 429s — the built-in
  # pacer spaces requests out automatically. (A free Pollinations account
  # raises the limit; a future update can take advantage of it.)
  image_workers: 1

paths:
  work_dir: "work"
  out_dir: "out"
  package_dir: "upload"
  state_file: "state.json"

telegram:
  # Phone control (free): text the bot a topic, get back a finished video.
  # Your PC must be on with `python main.py bot` running — the bot polls
  # Telegram from here, so no firewall or port setup is needed.
  enabled: false

  # 1. Message @BotFather on Telegram -> /newbot -> paste the token here
  #    (or export TELEGRAM_BOT_TOKEN instead of writing it in this file).
  bot_token: ""

  # 2. Message @userinfobot on Telegram -> paste your numeric user id here.
  #    The bot ONLY talks to this account — everyone else is ignored.
  owner_id: 0
